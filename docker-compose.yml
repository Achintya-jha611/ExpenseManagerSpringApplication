services:
  springboot:
    depends_on:
       mysql:
         condition: service_healthy
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin", "ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
        - mysql-data:/var/lib/mysql
volumes:
  mysql-data:

